<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دوّرها - عجلة تختارلك وتحسم الخناقة</title>
<meta name="description" content="مش عارفين ناكل فين أو نتفرج على إيه أو مين يدفع؟ دوّر العجلة وهي تحسم. ضيف اختياراتك أو اختار جاهز، وابعت العجلة لصحابك على واتساب.">
<meta property="og:title" content="دوّرها - عجلة تحسم الخناقة"><meta property="og:description" content="ناكل فين؟ نتفرج على إيه؟ مين يدفع؟ دوّر العجلة."><meta property="og:type" content="website">
<meta name="theme-color" content="#f97316">
<style>
:root{--pri:#f97316;--ink:#1c1917;--bg:#fff7ed;--mut:#78716c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:20px}
header{background:linear-gradient(135deg,#f97316,#e11d48);color:#fff;text-align:center;padding:16px 12px 20px}
header h1{margin:0;font-size:28px}header p{margin:4px 0 0;font-size:14px;opacity:.92}
main{max-width:560px;margin:0 auto;padding:0 12px}
.card{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0001}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.pc{flex:0 0 auto;border:2px solid transparent;background:#ffedd5;border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;white-space:nowrap;color:var(--ink)}
.pc.on{border-color:var(--pri);font-weight:700}
.wheelbox{position:relative;width:min(92vw,440px);margin:6px auto}
canvas#w{width:100%;display:block;border-radius:50%;box-shadow:0 8px 30px #0003;touch-action:manipulation}
.ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-inline:14px solid transparent;border-top:30px solid #1c1917;filter:drop-shadow(0 2px 2px #0006);z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;background:var(--ink);color:#fff;border:0;font:inherit;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 4px 14px #0006}
.res{text-align:center;font-size:30px;font-weight:900;min-height:48px;margin:12px 0 4px;color:#be123c}
.row{display:flex;gap:8px}.row input{flex:1;font:inherit;padding:10px;border:1.5px solid #fed7aa;border-radius:10px;min-width:0}
button.b{border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.g{background:#ffedd5;color:var(--ink)}button.wa{background:#16a34a}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.op{display:flex;gap:6px;align-items:center;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:99px;padding:5px 5px 5px 12px;font-size:14px}
.op b{background:#fee2e2;color:#dc2626;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px}
.sw{width:12px;height:12px;border-radius:50%}
.mut{color:var(--mut);font-size:13px}
label.t{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.hist{font-size:14px;line-height:1.9}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1}
</style></head><body>
<header><h1>🎡 دوّرها</h1><p>ناكل فين؟ نتفرج على إيه؟ مين يدفع؟ العجلة تحسم.</p></header>
<main>
<div class="card"><div class="scroll" id="pr"></div></div>
<div class="card">
<div class="wheelbox"><div class="ptr"></div><canvas id="w" width="880" height="880"></canvas><button class="hub" id="go" onclick="spin()">دوّر</button></div>
<div class="res" id="res"></div>
<div class="acts"><button class="b wa" onclick="shareRes()">ابعت النتيجة 💬</button><button class="b g" onclick="shareWheel()">ابعت العجلة 🎡</button></div>
<label class="t"><input type="checkbox" id="elim"> وضع الإقصاء: اللي يطلع يتشال من العجلة (لتوزيع الأدوار)</label>
<label class="t"><input type="checkbox" id="snd" checked> صوت</label>
</div>
<div class="card"><div class="row"><input id="ni" placeholder="ضيف اختيار (مثلاً: كشري)" maxlength="24"><button class="b" onclick="addO()">أضف</button></div>
<div class="opts" id="ol"></div><div class="mut" style="margin-top:8px" id="hint"></div></div>
<div class="card"><b>آخر النتايج</b><div class="hist" id="hist"><span class="mut">لسه ما دورتش</span></div></div>
</main>
<canvas id="img" style="display:none"></canvas>
<script>
const $=id=>document.getElementById(id);
const PRE={
'🍽️ ناكل فين':['كشري','فول وطعمية','شاورما','بيتزا','كباب وكفتة','برجر','سوشي','فراخ مشوية'],
'🎬 نتفرج على إيه':['أكشن','كوميدي','رعب','دراما','أنيميشن','وثائقي','رومانسي'],
'💸 مين يدفع':[],
'🎯 حقيقة ولا جرأة':['حقيقة','جرأة','حقيقة','جرأة','اسأل أي حد','تخطّى'],
'☕ نشرب إيه':['شاي','قهوة تركي','نسكافيه','عصير مانجا','سحلب','ينسون'],
'🎲 نلعب إيه':['كوتشينة','دومينو','طاولة','بلايستيشن','تخمين','ورقة وقلم'],
'🧹 مين يعمل المهمة':['غسيل الأطباق','رمي الزبالة','ترتيب الأوضة','شراء الطلبات']};
const COL=['#f97316','#ef4444','#eab308','#22c55e','#06b6d4','#6366f1','#d946ef','#ec4899','#14b8a6','#84cc16'];
let O=[],ang=0,spinning=false,H=[],cur='';
const names=Object.keys(PRE);
$('pr').innerHTML=names.map(n=>`<button class="pc" onclick="loadP('${n}')">${n}</button>`).join('');
function loadP(n){cur=n;O=PRE[n].slice();if(!O.length){O=['أنا','إنت','هو','هي']}
 document.querySelectorAll('.pc').forEach(b=>b.classList.toggle('on',b.textContent===n));$('res').textContent='';upd()}
function addO(){const v=$('ni').value.trim();if(!v||O.length>=24)return;O.push(v);$('ni').value='';upd();$('ni').focus()}
function delO(i){O.splice(i,1);upd()}
$('ni').addEventListener('keydown',e=>e.key==='Enter'&&addO());
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function upd(){$('ol').innerHTML=O.map((o,i)=>`<span class="op"><i class="sw" style="background:${COL[i%COL.length]}"></i>${esc(o)}<b onclick="delO(${i})">✕</b></span>`).join('');
 $('hint').textContent=O.length<2?'ضيف اختيارين على الأقل':O.length+' اختيار';draw();try{localStorage.setItem('dw',JSON.stringify({O,cur}))}catch(e){}}
function draw(){const c=$('w'),g=c.getContext('2d'),R=440,n=O.length;g.clearRect(0,0,880,880);g.save();g.translate(R,R);g.rotate(ang);
 if(!n){g.fillStyle='#e7e5e4';g.beginPath();g.arc(0,0,R-4,0,7);g.fill()}
 for(let i=0;i<n;i++){const a0=i*2*Math.PI/n,a1=(i+1)*2*Math.PI/n;g.fillStyle=COL[i%COL.length];g.beginPath();g.moveTo(0,0);g.arc(0,0,R-4,a0,a1);g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=4;g.stroke();
  g.save();g.rotate((a0+a1)/2);g.fillStyle='#fff';g.textAlign='right';g.direction='rtl';const fs=n>14?30:n>8?38:46;g.font='bold '+fs+'px sans-serif';g.shadowColor='#0005';g.shadowBlur=4;let t=O[i];while(g.measureText(t).width>R-140&&t.length>3)t=t.slice(0,-2);if(t!==O[i])t+='…';g.fillText(t,R-30,fs/3);g.restore()}
 g.restore();g.strokeStyle='#fff';g.lineWidth=14;g.beginPath();g.arc(R,R,R-4,0,7);g.stroke()}
let ac;function tick(f=900,d=.04,v=.05){if(!$('snd').checked)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),gn=ac.createGain();o.frequency.value=f;o.type='square';gn.gain.value=v;o.connect(gn);gn.connect(ac.destination);o.start();gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function spin(){if(spinning||O.length<2)return;spinning=true;$('res').textContent='...';
 const n=O.length,seg=2*Math.PI/n,win=Math.floor(Math.random()*n);
 // pointer at top (angle -PI/2). segment center must land there
 const target=-Math.PI/2-(win+.5)*seg+(Math.random()-.5)*seg*.7;
 let base=ang-(ang%(2*Math.PI));let end=base+2*Math.PI*(5+Math.floor(Math.random()*3))+((target%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
 if(end<ang+2*Math.PI*4)end+=2*Math.PI*2;
 const start=ang,dur=4600+Math.random()*1200,t0=performance.now();let lastSeg=-1;
 function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);ang=start+(end-start)*e;draw();
  const idx=Math.floor((((-Math.PI/2-ang)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/seg);if(idx!==lastSeg){lastSeg=idx;tick(700+Math.random()*300)}
  if(p<1)requestAnimationFrame(f);else done()}
 requestAnimationFrame(f)}
function done(){spinning=false;const n=O.length,seg=2*Math.PI/n;const idx=Math.floor((((-Math.PI/2-ang)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/seg)%n;const w=O[idx];
 $('res').textContent='🎉 '+w;H.unshift(w);H=H.slice(0,8);$('hist').innerHTML=H.map(x=>esc(x)).join(' ← ');tick(1200,.25,.08);setTimeout(()=>tick(1600,.3,.08),160);confetti();
 if($('elim').checked&&O.length>2){setTimeout(()=>{O.splice(idx,1);upd()},900)}}
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9;width:100%;height:100%';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const g=c.getContext('2d');const P=[];for(let i=0;i<120;i++)P.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,c:COL[i%10],r:Math.random()*6,s:4+Math.random()*6});let t=0;(function f(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});if(++t<100)requestAnimationFrame(f);else c.remove()})()}
function link(){return location.origin+location.pathname+'#'+btoa(unescape(encodeURIComponent(JSON.stringify({O,cur}))))}
function shareRes(){const r=$('res').textContent.replace('🎉 ','');if(!r||r==='...')return alert('دوّر العجلة الأول');window.open('https://wa.me/?text='+encodeURIComponent('🎡 العجلة حسمت'+(cur?' ('+cur+')':'')+': *'+r+'*\n\nدوّر عجلتك: '+location.origin+location.pathname),'_blank')}
function shareWheel(){if(O.length<2)return alert('ضيف اختيارين');window.open('https://wa.me/?text='+encodeURIComponent('🎡 دوّر العجلة دي معايا'+(cur?' ('+cur+')':'')+':\n'+link()),'_blank')}
try{const h=location.hash.slice(1);if(h){const d=JSON.parse(decodeURIComponent(escape(atob(h))));O=d.O;cur=d.cur||''}else{const l=JSON.parse(localStorage.getItem('dw')||'null');if(l&&l.O&&l.O.length){O=l.O;cur=l.cur||''}else loadP(names[0])}}catch(e){loadP(names[0])}
if(!O.length)loadP(names[0]);document.querySelectorAll('.pc').forEach(b=>b.classList.toggle('on',b.textContent===cur));upd();
</script></body></html>
